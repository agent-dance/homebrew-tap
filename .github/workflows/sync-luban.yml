name: Sync LUBAN Code

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sync-luban-code
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Update Cask from the latest release
        run: python3 scripts/update_luban.py
      - name: Commit an updated Cask
        shell: bash
        run: |
          if git diff --quiet -- Casks/luban-code.rb; then
            echo "Cask is already current."
            exit 0
          fi
          git config user.name "agent-dance release bot"
          git config user.email "releases@agent-dance.github.io"
          git add Casks/luban-code.rb
          git commit -m "chore(cask): sync luban-code release"
          git push
